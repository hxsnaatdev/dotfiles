[[mgr.prepend_keymap]]
on = ["g", "b"]
run = "cd ~/Downloads/books/"


[[mgr.prepend_keymap]]
on = ["g", "n"]
run = "cd ~/.config/nix-darwin/"
desc = "switch to nix-darwin config"

[[mgr.prepend_keymap]]
on = ["g", "o"]
run = "cd  /opt/homebrew/"
desc = "switch to /opt/homebrew"

[[mgr.prepend_keymap]]
on = ["g", "p"]
run = "cd /Users/ariz/proj/"

[[mgr.prepend_keymap]]
on = ["g", "l"]
run = "cd ~/learnings/"
desc = "switch to learnings"


[[mgr.prepend_keymap]]
on = ["g", "s"] 
run = "cd ~/SecondBrain/"
desc = "switch to SecondBrain"
